[tasks.build]
description = "Build Badge on Bar and copy to dist/"
run = "BADGEONBAR_OPEN_FINDER=1 ./scripts/build.sh"

[tasks.start]
description = "Stop running app, clean old builds, rebuild, copy to dist, and launch"
run = "./scripts/start.sh"

[tasks.xcode]
description = "Open BadgeOnBar.xcodeproj in Xcode"
run = "open BadgeOnBar/BadgeOnBar.xcodeproj"

[tasks.publish]
description = "Archive and upload Badge on Bar to App Store Connect"
run = "./scripts/publish.sh"

[tasks.push]
description = "Force-push main to Codeberg (origin) and GitHub (origin_backup)"
run = '''
set -euo pipefail
push_to() {
  local remote="$1"
  local repo="$2"
  git remote remove "$remote" 2>/dev/null || true
  git remote add "$remote" "$repo"
  git push -f "$remote" main
}
push_to origin "ssh://git@codeberg.org/grahamotte/badge-on-bar.git"
push_to origin_backup "git@github.com:grahamotte/badge-on-bar.git"
'''
